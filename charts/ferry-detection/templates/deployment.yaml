apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferry-detection.fullname" . }}
  labels:
    {{- include "ferry-detection.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ferry-detection.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ferry-detection.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: CHATKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: CHATKEY
            - name: TEST_LOCAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: TEST_LOCAL
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
          - name: certs
            mountPath: {{ .Values.secretMount.mountPath }}
            readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.existingSecret.name }}
            items:
{{- range .Values.secretMount.items }}
              - key: {{ .key }}
                path: {{ .path }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
